services:
  lichord:
    build: .
    container_name: lichord
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8787),timeout=2); s.close()"]
      interval: 30s
      timeout: 3s
      retries: 3
