[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lichord-addon"
version = "0.1.0"
description = "A multi-catalogue music source addon for BitChord"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LiChord contributors" }]
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "yt-dlp>=2025.1.15", "ytmusicapi>=1.10"]

[project.optional-dependencies]
presence = ["dbus-next>=0.2.3"]
test = ["pytest>=8", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5", "ruff>=0.6", "dbus-next>=0.2.3"]

[project.scripts]
lichord = "lichord.server:run"
lichord-presence = "lichord_presence.__main__:main"

[tool.setuptools.packages.find]
include = ["lichord*", "lichord_presence*"]

[tool.setuptools.package-data]
lichord_presence = ["static/*.html"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
